name: Auto Fetch & Update Digitalization News

on:
  schedule:
    # Chạy vào 6:00 AM và 18:00 PM giờ Việt Nam (23:00 và 11:00 UTC)
    - cron: '0 23,11 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công từ giao diện GitHub UI

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm install

      - name: Chạy script cào tin tức bằng Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run fetch-news

      - name: Tự động Commit & Push bài viết mới lên Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bai-viet-*.html
          git diff-index --quiet HEAD || git commit -m "bot: Tự động cập nhật bài viết tin tức mới nhất [skip ci]"
          git push